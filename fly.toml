# API do VotoCola no Fly.io (região São Paulo). Deploy a partir da raiz do monorepo: `fly deploy`.
# Segredos (não versionar): fly secrets set DATABASE_URL=... LEGAL_CONTROLLER=... LEGAL_CONTACT_EMAIL=...
app = "votocola"
primary_region = "gru"

[build]
  dockerfile = "packages/vc-api/Dockerfile"
  build-target = "prod"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  PUBLIC_URL = "https://votocola.nexti.dev"
  # app-ads.txt servido em https://nexti.dev/app-ads.txt (site do desenvolvedor nas lojas).
  ADMOB_PUBLISHER_ID = "pub-6785676183694375"
  # Preencher quando os apps forem publicados (botões na página inicial):
  # PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=app.votocola.mobile"
  # APP_STORE_URL = "https://apps.apple.com/br/app/votocola/id..."
  # O proxy do Fly é um salto: o IP real do cliente vem em X-Forwarded-For (rate limit por IP).
  TRUST_PROXY = "1"
  DB_LOGGING = "false"
  # Postgres gerenciado (Supabase): conexão cifrada e poucas conexões por máquina (pooler gratuito).
  DB_SSL = "true"
  DB_POOL_MAX = "5"

# Fotos e planos de governo (importados do TSE) até existir um CDN.
[mounts]
  source = "votocola_storage"
  destination = "/app/packages/vc-api/storage"

[http_service]
  internal_port = 4000
  force_https = true
  # Sempre ligada: sem "cold start" para quem abre o app. Com volume, o Fly roda 1 máquina por volume.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
